name: Docs check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
      - "release/**"
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "examples/**/*.md"
      - "notebooks/**/*.md"
      - "scripts/fix_github_math_macros.py"
      - ".github/workflows/docs-check.yml"

jobs:
  docs-check:
    name: Markdown and package metadata check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install docs/build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Check GitHub-compatible math macros
        run: |
          python scripts/fix_github_math_macros.py --check
      - name: Build package for README metadata validation
        run: |
          python -m build
      - name: Check package metadata
        run: |
          python -m twine check "dist/*"
